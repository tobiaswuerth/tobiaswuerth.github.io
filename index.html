    <script>
      // Apply the saved or system colour theme before the first paint (no light flash in dark mode).
      ;(() => {
        let saved = null
        try {
          saved = localStorage.getItem('theme-preference')
        } catch {
          // Storage blocked (e.g. strict privacy mode): follow the system theme.
        }
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>

  <body>
    <div id="app"></div>
    <script>
      // Return to the address 404.html was asked for (GitHub Pages serves it for deep links).
      ;(() => {
        let redirect = null
        try {
          redirect = sessionStorage.redirect
          delete sessionStorage.redirect
        } catch {
          // Storage blocked: 404.html could not keep the address, so the home page stays.
        }
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect)
        }
      })()
    </script>
